{% extends 'student/base.html' %}
{% block content %}

<style>
/* Page Header */
.page-header h4 {
    font-weight: 600;
}

.page-header p {
    color: #6c757d;
    margin-bottom: 0;
}

/* Card */
.profile-card {
    border-radius: 14px;
    border: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

/* Form Controls */
.form-control {
    border-radius: 8px;
    padding: 10px 14px;
}

.form-control:focus {
    border-color: #343a40;
    box-shadow: 0 0 0 0.15rem rgba(0,0,0,0.1);
}

/* Section Divider */
.section-title {
    font-size: 14px;
    font-weight: 600;
    color: #6c757d;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Buttons */
.btn {
    border-radius: 8px;
    padding: 8px 16px;
    font-weight: 500;
}

/* Profile Preview */
.profile-preview {
    text-align: center;
    margin-bottom: 25px;
}

.profile-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, #343a40, #495057);
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
}
</style>

<div class="container pt-5 mt-4">

    <!-- Page Header -->
    <div class="page-header mb-4">
        <h4>Edit Profile</h4>
        <p>Update your personal information</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <div class="card profile-card">
                <div class="card-body p-4">

                    <!-- Profile Preview -->
                    <div class="profile-preview">
                        <div class="profile-avatar">
                            {{ student.user.username|slice:":1"|upper }}
                        </div>
                        <h6 class="mb-0 text-dark">{{ student.user.first_name }}</h6>
                        <small class="text-muted">
                            {{ student.user.email }}
                        </small>
                    </div>

                    <hr class="mb-4">

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="section-title">Academic Details</div>

                        <!-- Department -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Department
                            </label>
                            <input type="text"
                                   name="department"
                                   value="{{ student.department }}"
                                   class="form-control">
                        </div>

                        <!-- Semester -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Semester
                            </label>
                            <input type="number"
                                   name="semester"
                                   value="{{ student.semester }}"
                                   class="form-control">
                        </div>

                        <hr class="my-4">

                        <div class="section-title">Contact Information</div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Phone
                            </label>
                            <input type="text"
                                   name="phone"
                                   value="{{ student.phone }}"
                                   class="form-control">
                        </div>

                        <!-- Address -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Address
                            </label>
                            <textarea name="address"
                                      rows="3"
                                      class="form-control">{{ student.address }}</textarea>
                        </div>

                        <hr class="my-4">

                        <div class="section-title">Verification</div>

                        <!-- Registration No -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Registration No
                            </label>
                            <input type="text"
                                   name="registration_no"
                                   value="{{ student.registration_no }}"
                                   class="form-control">
                        </div>

                        <!-- ID Proof -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Upload ID Proof
                            </label>
                            <input type="file"
                                   name="student_id"
                                   class="form-control">
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'student_profile' %}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                            <button type="submit"
                                    class="btn btn-dark">
                                Save Changes
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
