{% extends 'student/base.html' %}
{% block content %}

<style>
.chat-wrapper {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.06);
    overflow: hidden;
}

.chat-header {
    padding: 15px 20px;
    border-bottom: 1px solid #f1f1f1;
    font-weight: 600;
}

.chat-body {
    height: 350px;
    overflow-y: auto;
    padding: 20px;
    background: #f8f9fa;
}

.chat-message {
    margin-bottom: 15px;
}

.chat-message b {
    font-size: 14px;
}

.chat-time {
    font-size: 11px;
    color: #6c757d;
}

.chat-form {
    padding: 15px;
    border-top: 1px solid #f1f1f1;
    background: #fff;
}
</style>

<div class="container pt-5 mt-4">

    <!-- Back Button + Title -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">{{ group.name }}</h4>
        <a href="{% url 'view_groups' %}" class="btn btn-secondary btn-sm">
            ← Back to Groups
        </a>
    </div>

    <div class="chat-wrapper">

        <!-- Chat Header -->
        <div class="chat-header">
            Group Discussion
        </div>

        <!-- Messages -->
        <div class="chat-body">

            {% for m in messages %}
            <div class="chat-message">
                <b>{{ m.sender.user.username }}</b><br>
                {{ m.message }}<br>
                <span class="chat-time">{{ m.timestamp }}</span>
            </div>
            {% empty %}
            <p class="text-muted text-center mt-3">No messages yet.</p>
            {% endfor %}

        </div>

        <!-- Message Form -->
        <div class="chat-form">
            <form method="post" class="d-flex">
                {% csrf_token %}
                <input type="text" 
                       name="message" 
                       class="form-control me-2"
                       placeholder="Type your message..."
                       required>
                <button type="submit" class="btn btn-dark">
                    <i class="bi bi-send-fill"></i>
                </button>
            </form>
        </div>

    </div>

</div>

{% endblock %}
