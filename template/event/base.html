{% load static %}
<!DOCTYPE HTML>
<html>
<head>
    <title>Cloud Campus - Student Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your Theme CSS -->
    <link rel="stylesheet" href="{% static 'Broadcast-1.0.0/assets/css/main.css' %}">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- ================= HEADER ================= -->
<header id="header" class="bg-dark text-white px-4 py-3 d-flex justify-content-between align-items-center">
    <h4 class="mb-0">
        <a href="" class="text-white text-decoration-none">
            Cloud Campus - Student
        </a>
    </h4>
    <a href="#menu" class="text-white text-decoration-none">Menu</a>
</header>

<!-- ================= STUDENT NAVBAR ================= -->
<nav id="menu">
    <ul class="links">

        <li><a href="{% url 'manager_home'  %}">Dashboard</a></li>

        <li><a href="{% url 'create_event' %}">Create Event</a></li>

        <li><a href="{% url 'view_events_for_manager' %}">Manage Events</a></li>

        <li><a href="{% url 'view_event_participants' %}">Participants Requests</a></li>

        <li><a href="{% url 'view_programmes' %}">Programmes</a></li>





        <li><a href="{% url 'logoutuser' %}" class="logout-link">Logout</a></li>

    </ul>
</nav>

<!-- ================= OPTIONAL BANNER ================= -->
{% block banner %}
{% endblock %}

<!-- ================= MAIN CONTENT ================= -->
<main class="flex-fill container my-4">
    {% block content %}
    {% endblock %}
</main>

<!-- ================= SMALL FOOTER ================= -->
<footer class="bg-dark text-light text-center py-3 mt-auto">
    <p class="mb-0 small">
        © {% now "Y" %} Cloud Campus | Student Portal
    </p>
</footer>

<!-- ================= SCRIPTS ================= -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Your Theme Scripts -->
<script src="{% static 'Broadcast-1.0.0/assets/js/jquery.min.js' %}"></script>
<script src="{% static 'Broadcast-1.0.0/assets/js/jquery.scrolly.min.js' %}"></script>
<script src="{% static 'Broadcast-1.0.0/assets/js/skel.min.js' %}"></script>
<script src="{% static 'Broadcast-1.0.0/assets/js/util.js' %}"></script>
<script src="{% static 'Broadcast-1.0.0/assets/js/main.js' %}"></script>

</body>
</html>
