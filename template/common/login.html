{% extends 'common/base.html' %}
{% block content %}

<section class="wrapper">
    <div class="inner">

        <header class="align-center">
            <h2>Login</h2>
            <p>Access your student or event manager account</p>
        </header>

        <div style="max-width:500px; margin:0 auto;">

            {% if messages %}
                {% for message in messages %}
                    <div style="background:#ffe0e0; padding:10px; margin-bottom:15px; border-radius:5px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <label>Username</label>
                <input type="text" name="username" required>

                <label>Password</label>
                <input type="password" name="password" required>

                <br>
                <button type="submit" class="button special fit">
                    Login
                </button>
            </form>

            <br>

            <div style="text-align:center;">
                <a href="{% url 'forgot_password_for_all' %}">
                    Forgot Password?
                </a>
            </div>

        </div>

    </div>
</section>

{% endblock %}
